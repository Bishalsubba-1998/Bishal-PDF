name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repository layout
        run: |
          pwd
          find . -maxdepth 3 -not -path './.git/*' | sort | head -60

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: |
          # Find the project folder even if the files were uploaded inside a sub-folder.
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found. Upload the CONTENTS of the SumatraDroid folder (app/, build.gradle.kts, settings.gradle.kts, ...) to the repository."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project folder: $DIR"
          cd "$DIR"
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SumatraDroid-apk
          path: '**/build/outputs/apk/release/*.apk'
